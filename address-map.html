<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --border: #1e2430;
    --accent: #f0c040;
    --accent2: #40c0f0;
    --accent3: #f04060;
    --text: #e8eaf0;
    --muted: #6b7280;
    --card: #161b26;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
  }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  header span {
    font-size: 11px;
    color: var(--muted);
  }
  .stat-pills {
    display: flex;
    gap: 10px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .pill {
    background: var(--border);
    border: 1px solid #2a3040;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 11px;
    color: var(--text);
    white-space: nowrap;
  }
  .pill strong { color: var(--accent); }
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  #map {
    flex: 1;
    background: #0d1117;
  }
  .sidebar {
    width: 300px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 10px;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .sidebar-content::-webkit-scrollbar { width: 4px; }
  .sidebar-content::-webkit-scrollbar-track { background: var(--surface); }
  .sidebar-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .rank-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .rank-item:hover { border-color: var(--accent); }
  .rank-num {
    font-size: 10px;
    color: var(--muted);
    width: 18px;
    text-align: right;
    flex-shrink: 0;
  }
  .rank-label {
    flex: 1;
    font-size: 11px;
    color: var(--text);
    line-height: 1.3;
  }
  .rank-label small { color: var(--muted); font-size: 10px; display: block; }
  .rank-bar-wrap {
    width: 60px;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .rank-bar {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
  }
  .rank-count {
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    width: 24px;
    text-align: right;
    flex-shrink: 0;
  }
  .section-head {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 8px 0 6px;
  }
  .legend {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--muted);
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  /* Custom marker cluster styles */
  .marker-cluster-small { background-color: rgba(64,192,240,0.2) !important; }
  .marker-cluster-small div { background-color: rgba(64,192,240,0.7) !important; color: #fff !important; font-family: 'Space Mono', monospace !important; font-size: 11px !important; font-weight: 700 !important; }
  .marker-cluster-medium { background-color: rgba(240,192,64,0.2) !important; }
  .marker-cluster-medium div { background-color: rgba(240,192,64,0.7) !important; color: #111 !important; font-family: 'Space Mono', monospace !important; font-size: 11px !important; font-weight: 700 !important; }
  .marker-cluster-large { background-color: rgba(240,64,96,0.2) !important; }
  .marker-cluster-large div { background-color: rgba(240,64,96,0.7) !important; color: #fff !important; font-family: 'Space Mono', monospace !important; font-size: 11px !important; font-weight: 700 !important; }
  .leaflet-popup-content-wrapper {
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .leaflet-popup-tip { background: var(--accent); }
  .popup-addr { font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .popup-city { color: var(--accent2); }
  .popup-zip { color: var(--muted); }
</style>

// City color palette
const cityColors = {

  "Round Rock": "#f0c040",
  "Cedar Park": "#f04060",
  "Leander": "#a040f0",
  "Pflugerville": "#40f0a0",

  "Rollingwood": "#c0e040",
  "New Braunfels": "#40a0ff",
  "Buda": "#ff8060",
  "San Marcos": "#80ffb0",
};

function cityColor(city) {
  return cityColors[city] || "#808080";
}

// Scatter coordinates with small jitter for same-zip addresses
function jitter(val, amount = 0.018) {
  return val + (Math.random() - 0.5) * amount;
}

// ── Map init ─────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([30.3500, -97.9000], 10);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const markers = L.markerClusterGroup({
  maxClusterRadius: 60,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: true,
  zoomToBoundsOnClick: true,
  iconCreateFunction: function(cluster) {
    const count = cluster.getChildCount();
    let size = count < 10 ? 'small' : count < 20 ? 'medium' : 'large';
    return L.divIcon({
      html: `<div>${count}</div>`,
      className: `marker-cluster marker-cluster-${size}`,
      iconSize: L.point(40, 40)
    });
  }
});

const placed = [];
rawAddresses.forEach(item => {
  const centroid = zipCentroids[item.zip];
  if (!centroid) return;
  const lat = jitter(centroid[0]);
  const lng = jitter(centroid[1]);

  const color = cityColor(item.city);
  const icon = L.divIcon({
    html: `<div style="width:10px;height:10px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,0.4);box-shadow:0 0 6px ${color}88;"></div>`,
    className: '',
    iconSize: [10, 10],
    iconAnchor: [5, 5]
  });

  const marker = L.marker([lat, lng], { icon });
  marker.bindPopup(`
    <div class="popup-addr">${item.addr.split(',')[0]}</div>
    <div class="popup-city">${item.city}</div>
    <div class="popup-zip">ZIP: ${item.zip}</div>
  `);
  markers.addLayer(marker);
  placed.push({ ...item, lat, lng });
});

  zipCounts[r.zip] = (zipCounts[r.zip] || 0) + 1;
  cityCounts[r.city] = (cityCounts[r.city] || 0) + 1;
});

document.getElementById('zipCount').textContent = Object.keys(zipCounts).length;

const maxZip = sortedZips[0][1];

zipPanel.innerHTML = '<div class="section-head">Top ZIP Codes by Frequency</div>';

  const pct = Math.round((count / maxZip) * 100);

  div.innerHTML = `
    <div class="rank-num">#${i+1}</div>
    <div class="rank-label">${zip}<small>${city}</small></div>
    <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%;background:${color}"></div></div>
    <div class="rank-count" style="color:${color}">${count}</div>
  `;
  div.addEventListener('click', () => {
    const c = zipCentroids[zip];
    if (c) map.setView(c, 13);
  });
  zipPanel.appendChild(div);
});

// ── Sidebar City panel ────────────────────────────────────────────────────────
const sortedCities = Object.entries(cityCounts).sort((a,b) => b[1]-a[1]);
const maxCity = sortedCities[0][1];
const cityPanel = document.getElementById('cityPanel');

cityPanel.innerHTML = '<div class="section-head">Cities by Address Count</div>';
sortedCities.forEach(([city, count], i) => {
  const pct = Math.round((count / maxCity) * 100);
  const color = cityColor(city);
  const div = document.createElement('div');
  div.className = 'rank-item';
  div.innerHTML = `
    <div class="rank-num">#${i+1}</div>
    <div class="rank-label">${city}</div>
    <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%;background:${color}"></div></div>
    <div class="rank-count" style="color:${color}">${count}</div>
  `;
  cityPanel.appendChild(div);
});

// ── Tab switching ─────────────────────────────────────────────────────────────
function showTab(which) {
  document.getElementById('zipPanel').style.display = which === 'zips' ? 'block' : 'none';
  document.getElementById('cityPanel').style.display = which === 'cities' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0 && which==='zips') || (i===1 && which==='cities'));
  });
}
</script>
</body>
</html>
